name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Test
        continue-on-error: true
        run: npm test -- --watchAll=false --coverage

      - name: Build
        run: npm run build
        env:
          CI: true
          # Placeholder env for CI only; set real values in Vercel/host env
          REACT_APP_API_URL: https://blog-backend-2-5hun.onrender.com
          REACT_APP_FIREBASE_API_KEY: placeholder-for-ci
          REACT_APP_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          REACT_APP_FIREBASE_PROJECT_ID: placeholder
          REACT_APP_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: 123
          REACT_APP_FIREBASE_APP_ID: 1:123:web:abc
          REACT_APP_FIREBASE_MEASUREMENT_ID: G-XXXXXXXXXX
